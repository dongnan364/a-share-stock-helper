services:
  - type: web
    name: a-share-stock-helper
    runtime: node
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "npm start"
    envVars:
      - key: HOST
        value: "0.0.0.0"
      - key: PYTHON
        value: "python"
      - key: AI_BASE_URL
        value: "https://grsai.dakka.com.cn/v1"
      - key: AI_MODEL
        value: "gpt-5.5"
